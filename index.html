<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script src="./script.js" defer></script>
    <title>To-Doifier</title>  
</head>
<body>
    <section class="todo">
        <h2>To-Do Listifier</h2>
        <div class="input">
            <input type="text" class="input-field" id="todoInput" placeholder="New goal? Add it here."/>
        <button class="btn">Add</button>
        </div>
        <ul class="scroll" id="todoList"></ul>
        <div>
            <div class="progress">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="counter-container">
            <p class="count-badge"><span id="doneCount">0</span> / <span id="todoCount">0</span>Done</p> 
            <button id="deleteButton">Clear All</button>
            </div>

            </div>
        </div>
    </section>
    <footer>
        <div class="footer">
            <p class="made-by">Made By</p>
            <p class="author">Mustard</p>
        </div>
    </footer>
</body>
</html>
